# FBSS phase-one sidecar. Managed by tools/deploy-api2-fbss.ps1.
location = /api/fbss {
    proxy_pass http://127.0.0.1:4173/api/fbss;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-FBSS-Public-Route /api/fbss;
    access_log /var/log/fbss/fbss-api-access.log fbss_observe buffer=32k flush=5s;
    proxy_read_timeout 120s;
}

location /api/fbss/ {
    proxy_pass http://127.0.0.1:4173/api/fbss/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-FBSS-Public-Route /api/fbss/;
    access_log /var/log/fbss/fbss-api-access.log fbss_observe buffer=32k flush=5s;
    proxy_read_timeout 120s;
}

# FBSS console is an API2 admin menu surface, not a standalone anonymous app.
# The public connector URL remains /fbs-mcp/mcp. Its exact-route upstream may be
# the FBSS sidecar after cutover; this console guard does not decide that route.
# It only protects browser console access and keeps anonymous users on login.
location = /__fbss_console_login_redirect {
    internal;
    return 302 /login?redirect=$request_uri;
}

location = /fbss/public/liuxue-yanxue/lebao {
    return 302 /fbss/public/liuxue-yanxue/lebao/;
}

location /fbss/public/liuxue-yanxue/lebao/ {
    access_log /var/log/fbss/fbss-api-access.log fbss_observe buffer=32k flush=5s;
    proxy_pass http://127.0.0.1:4173/fbss/public/liuxue-yanxue/lebao/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-FBSS-Public-Route /fbss/public/liuxue-yanxue/lebao/;
    add_header X-FBSS-Anonymous-Access public-landing always;
    proxy_read_timeout 120s;
}

location = /fbss {
    if ($http_cookie !~* "(^|;\s*)Admin-Token=[^;]+") {
        return 302 /fbss/login?redirect=$request_uri;
    }
    return 302 /fbss/;
}

location = /fbss/login {
    return 302 /fbss/login/;
}

location /fbss/login/ {
    access_log /var/log/fbss/fbss-api-access.log fbss_observe buffer=32k flush=5s;
    proxy_pass http://127.0.0.1:4173/login/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-FBSS-Console-Surface "api2-menu-login" always;
    add_header X-FBSS-Anonymous-Access "login-page" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    proxy_read_timeout 120s;
}

location /fbss/ {
    if ($http_cookie !~* "(^|;\s*)Admin-Token=[^;]+") {
        return 302 /fbss/login?redirect=$request_uri;
    }
    access_log /var/log/fbss/fbss-api-access.log fbss_observe buffer=32k flush=5s;
    proxy_pass http://127.0.0.1:4173/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-FBSS-Console-Surface "api2-menu" always;
    add_header X-FBSS-Anonymous-Access "blocked" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    proxy_read_timeout 120s;
}


# W05E authoritative readback is loopback-only. The broad /prod-api/ proxy
# must never expose this internal tuple oracle, even while the Java feature is off.
location = /prod-api/internal/independent-board/attribution/events/readback {
    add_header Cache-Control "no-store" always;
    return 404;
}
