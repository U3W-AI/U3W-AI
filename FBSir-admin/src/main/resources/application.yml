# 项目相关配置
fbsir:
  # 名称
  name: 福帮手
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2026
  # 文件路径示例（Windows 默认保留 D:/WxFbsir/uploadPath，Linux 可配置 /home/FBSir/uploadPath）
  # 兼容说明：未显式配置路径时继续使用历史目录，避免升级后看不到既有文件。
  profile: ${FBSIR_FILE_PATH:${WXFBSIR_FILE_PATH:D:/WxFbsir/uploadPath}}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # 域名配置（用于拼接完整URL）
  # 开发环境：http://localhost:8080
  # 生产环境/内网穿透：使用实际访问域名（如 http://your-domain.com）
  # 建议使用环境变量：WXFBSIR_DOMAIN
  domain: ${FBSIR_DOMAIN:${WXFBSIR_DOMAIN:http://localhost:8080}}
  independent-board:
    credit-candidate:
      # Default-off credit shadow-ledger HTTP surface. Keep false until permission, UI and deployment gates pass.
      enabled: ${FBSIR_INDEPENDENT_BOARD_CREDIT_CANDIDATE_ENABLED:false}
    portal-candidate:
      # Default-off read-only candidate surface. Enable only with two independent 32-byte base64url keys.
      enabled: ${FBSIR_INDEPENDENT_BOARD_PORTAL_CANDIDATE_ENABLED:false}
      cursor-key-base64: ${FBSIR_INDEPENDENT_BOARD_PORTAL_CURSOR_KEY_BASE64:}
      reference-key-base64: ${FBSIR_INDEPENDENT_BOARD_PORTAL_REFERENCE_KEY_BASE64:}
      cursor-ttl: ${FBSIR_INDEPENDENT_BOARD_PORTAL_CURSOR_TTL:PT15M}
    connector:
      # OAuth issuer 必须由部署环境显式绑定；空值保持 VIP fail closed。
      issuer-uri: ${FBSIR_BOARD_OAUTH_ISSUER:}
      # 延续现有福帮手 Connector 的唯一 MCP 资源，不另造 Marketplace 入口。
      resource-uri: ${FBSIR_BOARD_OAUTH_RESOURCE:https://api2.u3w.com/fbs-mcp/mcp}
    oauth:
      # 仅保存短期 state 密文的仓库外 AES-256-GCM key；空值保持授权请求创建 fail closed。
      state-key-ref: ${FBSIR_BOARD_OAUTH_STATE_KEY_REF:}
      state-key-base64: ${FBSIR_BOARD_OAUTH_STATE_KEY_BASE64:}
    attribution:
      # W4b.2d 仅内部证据写入；默认关闭，不注册公开路由或权威积分。
      enabled: ${FBSIR_BOARD_ATTRIBUTION_ENABLED:false}
      candidate-enabled: ${FBSIR_BOARD_ATTRIBUTION_CANDIDATE_ENABLED:false}
      public-route-enabled: ${FBSIR_BOARD_ATTRIBUTION_PUBLIC_ROUTE_ENABLED:false}
      authoritative-credit-enabled: ${FBSIR_BOARD_ATTRIBUTION_CREDIT_ENABLED:false}
      issuer: ${FBSIR_BOARD_ATTRIBUTION_ISSUER:api2.u3w.com}
      audience: ${FBSIR_BOARD_ATTRIBUTION_AUDIENCE:independent-board-attribution}
      key-ref: ${FBSIR_BOARD_ATTRIBUTION_KEY_REF:fbs.w4b2d.api2.keyring}
      receipt-ttl-seconds: ${FBSIR_BOARD_ATTRIBUTION_RECEIPT_TTL_SECONDS:120}
      retention-hours: ${FBSIR_BOARD_ATTRIBUTION_RETENTION_HOURS:26}
  websocket: # 是否启用 WebSocket 服务
      enabled: true
      # ⚠️ 【重要】WebSocket 端点路径 - 请勿随意更改
      # 此路径用于Engine节点连接，同时影响：
      # 1. WebSocket连接地址：ws://domain:port/ws/engine
      # 2. HTTP截图上传地址：http://domain:port/engine/screenshot/upload
      # 3. 前端WebSocket连接地址转换
      # 修改此路径会导致Engine节点无法连接和截图上传失败
      # 如需修改，必须同步修改：
      # - FBSir-engine/application.yml 中的 ws-url
      # - ScreenshotUploadClient.java 中的路径解析逻辑
      path: /ws/engine
      # Engine 节点握手与截图上传共享凭证；至少32字符，不得提交默认值。
      engine-token: ${FBSIR_ENGINE_TOKEN:${WXFBSIR_ENGINE_TOKEN:}}
      # 浏览器 WebSocket 允许来源，逗号分隔；空值保留同源策略，禁止默认 *。
      allowed-origins: ${FBSIR_WEBSOCKET_ALLOWED_ORIGINS:${WXFBSIR_WEBSOCKET_ALLOWED_ORIGINS:}}
      # 最大连接数
      max-connections: 10000
      # 最大消息大小（字节）1MB
      max-message-size: 1048576
      # 心跳间隔（秒）
      heartbeat-interval: 30
      # 心跳超时时间（秒）
      heartbeat-timeout: 10
      # 会话清理间隔（秒）
      session-cleanup-interval: 60
      # 消息队列最大大小
      message-queue-size: 10000

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
# 日志配置
logging:
  level:
    root: info
    com.wx.fbsir: info
    com.wx.fbsir.business.websocket.server.EngineWebSocketHandler: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 20MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: ${FBSIR_REDIS_HOST:${WXFBSIR_REDIS_HOST:127.0.0.1}}
      # 端口，默认为6379
      port: ${FBSIR_REDIS_PORT:${WXFBSIR_REDIS_PORT:6379}}
      # 数据库索引
      database: ${FBSIR_REDIS_DATABASE:${WXFBSIR_REDIS_DATABASE:0}}
      # 密码
      password: ${FBSIR_REDIS_PASSWORD:${WXFBSIR_REDIS_PASSWORD:}}
      # 连接超时时间（减少到5秒，快速失败）
      timeout: 5s
      # 客户端名称
      client-name: fbsir-admin
      lettuce:
        pool:
          # 连接池中的最小空闲连接（减少初始连接数）
          min-idle: 2
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池的最大数据库连接数
          max-active: 20
          # 连接池最大阻塞等待时间（减少到5秒，快速失败）
          max-wait: 5000ms
        # 关闭超时时间
        shutdown-timeout: 2000ms
        # 集群拓扑刷新配置（解决Redis重连慢的问题）
        cluster:
          refresh:
            # 启用自适应拓扑刷新
            adaptive: true
            # 定期刷新间隔（60秒）
            period: 60s

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（必须通过 FBSIR_TOKEN_SECRET 提供；WXFBSIR_TOKEN_SECRET 仅兼容旧部署）
  secret: ${FBSIR_TOKEN_SECRET:${WXFBSIR_TOKEN_SECRET:}}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.wx.fbsir.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.wx.fbsir.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,wx.fbsir.com,www.wx.fbsir.com

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
# AES加密配置
aes:
  secret:
    # AES加密密钥（256位）- 请勿泄露
    # 生产环境建议使用环境变量：WXFBSIR_AES_SECRET_KEY
    # 此密钥用于加密敏感数据（如公众号AppID、AppSecret等）
    # 密钥复杂度：包含大小写字母、数字、特殊符号，长度64位
    key: ${FBSIR_AES_SECRET_KEY:${WXFBSIR_AES_SECRET_KEY:}}

# 企业微信消息推送密钥使用独立的可轮换版本密钥；不得提交默认密钥。
webhook:
  # 可写入消息卡片的U3W签名跳转域名，逗号分隔；空值时禁用行动链接。
  action-hosts: ${FBSIR_WEBHOOK_ACTION_HOSTS:${WXFBSIR_WEBHOOK_ACTION_HOSTS:}}
  delivery:
    sweep-enabled: ${FBSIR_WEBHOOK_SWEEP_ENABLED:${WXFBSIR_WEBHOOK_SWEEP_ENABLED:true}}
    sweep-ms: ${FBSIR_WEBHOOK_SWEEP_MS:${WXFBSIR_WEBHOOK_SWEEP_MS:60000}}
  crypto:
    current-version: ${FBSIR_WEBHOOK_KEY_VERSION:${WXFBSIR_WEBHOOK_KEY_VERSION:v1}}
    keys:
      v1: ${FBSIR_WEBHOOK_SECRET_KEY_V1:${WXFBSIR_WEBHOOK_SECRET_KEY_V1:}}
      v2: ${FBSIR_WEBHOOK_SECRET_KEY_V2:${WXFBSIR_WEBHOOK_SECRET_KEY_V2:}}

# Gitee OAuth配置
gitee:
  oauth:
    # OAuth Client ID（生产环境建议使用环境变量：GITEE_OAUTH_CLIENT_ID）
    client-id: ${GITEE_OAUTH_CLIENT_ID:}
    # OAuth Client Secret（生产环境建议使用环境变量：GITEE_OAUTH_CLIENT_SECRET）
    client-secret: ${GITEE_OAUTH_CLIENT_SECRET:}
    # 前端地址（OAuth完成后跳转）
    frontend-url: ${GITEE_OAUTH_FRONTEND_URL:}
    # OAuth回调地址（与Gitee应用配置保持一致）
    callback-url: ${GITEE_OAUTH_CALLBACK_URL:}

# 微信机器人配置
wechat:
  # 企业微信机器人Token（生产环境建议使用环境变量：WECHAT_TOKEN）
  token: ${WECHAT_TOKEN:}
  # 企业微信机器人AES密钥（生产环境建议使用环境变量：WECHAT_AES_KEY）
  aes-key: ${WECHAT_AES_KEY:}
  # 企业自建智能机器人回调的 receiveId 按官方协议固定为空字符串，不配置 CorpID
  # 企业微信提示词编辑器链接（生产环境建议使用环境变量：PROMPT_EDITOR_URL）
  prompt-editor-url: ${PROMPT_EDITOR_URL:}

# 企业微信智能机器人编排控制面
smartbot:
  # 用于对企微不透明发送者/会话/消息标识做 HMAC；Base64 解码后至少 32 字节，不能与回调 Token/AESKey 共用
  identity-hmac-key-base64: ${SMARTBOT_IDENTITY_HMAC_KEY_BASE64:}
